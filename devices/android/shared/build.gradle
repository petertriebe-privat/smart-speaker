plugins {
    id 'com.android.library'
}

// Shared by the Android apps: the HUD renderer and hologram (assets), the overlay window, the
// full-screen activity with its native video and web layers.
android {
    namespace 'dev.jarvis.shared'
    compileSdk 34

    defaultConfig {
        minSdk 25
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

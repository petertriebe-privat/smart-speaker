plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.jarvis.screen'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.jarvis.screen'
        minSdk 28          // Fire OS 7 (Android 9); Fire OS 6 (7.1) lacks startForegroundService
        targetSdk 30       // Fire OS 8 is Android 11; sideloaded, never in a store
        versionCode rootProject.ext.assistantVersionCode
        versionName rootProject.ext.assistantVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    // the core (libjarvis.so) must lie as a file in nativeLibraryDir to run
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        warningsAsErrors true
    }
}

dependencies {
    implementation project(':shared')
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}

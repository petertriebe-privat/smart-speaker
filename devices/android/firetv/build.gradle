plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.jarvis.screen'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.jarvis.screen'
        minSdk 25          // Fire OS 6
        targetSdk 30       // Fire OS 8 is Android 11; sideloaded, never in a store
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':shared')
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}

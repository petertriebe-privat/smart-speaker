plugins {
    id 'com.android.application'
}

// The phone app (#75): a assistant of its own (core/ for arm64, board phone) with the Fire TV app's
// HUD and hologram upright, the assistant's button to talk, and the screen for its cards.
android {
    namespace 'dev.smartspeaker.phone'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.smartspeaker.phone'
        minSdk 29          // Android 10
        targetSdk 34       // sideloaded, never in a store
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a' // the core is built for it (tools/install_phone.sh)
        }
    }

    // The echo canceller (SpeexDSP, shared/src/main/cpp): built into the phone app only, so the
    // Fire TV's build needs no NDK. EchoCanceller.java finds it or does without.
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake {
            path '../shared/src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // The icon is the Fire TV app's (tools/make_icons.py writes it there).
    sourceSets {
        main.res.srcDirs += '../firetv/src/main/res'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    // the core (libassistant.so) must lie as a file in nativeLibraryDir to run
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':shared')
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // Android Auto (car/): the Car App Library's templates on the car's screen
    implementation 'androidx.car.app:app:1.4.0'
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>microSD-to-SD adapter: contact pins and wires</title>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#1a1a1a">SD adapter (passive microSD-to-SD), contact side up</text>
  <text x="20" y="54" fill="#444">Bevelled corner top left. Pins left to right: 9, 1, 2, 3, 4, 5, 6, 7, 8. The microSD card stays inside the adapter.</text>

  <!-- adapter body with bevel -->
  <path d="M 80 80 L 560 80 L 560 330 L 40 330 L 40 120 Z" fill="#2b2b2b" stroke="#111" stroke-width="2"/>

  <!-- contacts: x positions for 9,1,2,...,8 -->
  <g text-anchor="middle">
    <rect x="62"  y="92" width="34" height="70" rx="3" fill="#e2b93b"/><text x="79"  y="186" fill="#fff" font-weight="bold">9</text>
    <rect x="114" y="92" width="44" height="70" rx="3" fill="#e2b93b"/><text x="136" y="186" fill="#fff" font-weight="bold">1</text>
    <rect x="170" y="92" width="44" height="70" rx="3" fill="#e2b93b"/><text x="192" y="186" fill="#fff" font-weight="bold">2</text>
    <rect x="226" y="92" width="44" height="70" rx="3" fill="#e2b93b"/><text x="248" y="186" fill="#fff" font-weight="bold">3</text>
    <rect x="282" y="92" width="44" height="70" rx="3" fill="#e2b93b"/><text x="304" y="186" fill="#fff" font-weight="bold">4</text>
    <rect x="338" y="92" width="44" height="70" rx="3" fill="#e2b93b"/><text x="360" y="186" fill="#fff" font-weight="bold">5</text>
    <rect x="394" y="92" width="44" height="70" rx="3" fill="#e2b93b"/><text x="416" y="186" fill="#fff" font-weight="bold">6</text>
    <rect x="450" y="92" width="44" height="70" rx="3" fill="#e2b93b"/><text x="472" y="186" fill="#fff" font-weight="bold">7</text>
    <rect x="506" y="92" width="34" height="70" rx="3" fill="#e2b93b"/><text x="523" y="186" fill="#fff" font-weight="bold">8</text>
  </g>

  <!-- wires out of the top of each contact -->
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 79 92 L 79 72"   stroke="#8a3fc4"/>
    <path d="M 136 92 L 136 72" stroke="#808080"/>
    <path d="M 192 92 L 192 72" stroke="#f08a1c"/>
    <path d="M 248 92 L 248 72" stroke="#000000"/>
    <path d="M 304 92 L 304 72" stroke="#d11f1f"/>
    <path d="M 360 92 L 360 72" stroke="#7a5a2a"/>
    <path d="M 416 92 L 416 72" stroke="#000000"/>
    <path d="M 472 92 L 472 72" stroke="#2e9e44"/>
    <path d="M 523 92 L 523 72" stroke="#2a63d4"/>
  </g>

  <!-- signal labels inside the body -->
  <g text-anchor="middle" fill="#ffffff" font-size="13">
    <text x="79"  y="222">D2</text>
    <text x="136" y="222">D3</text>
    <text x="192" y="222">CMD</text>
    <text x="248" y="222">GND</text>
    <text x="304" y="222">VDD</text>
    <text x="360" y="222">CLK</text>
    <text x="416" y="222">GND</text>
    <text x="472" y="222">D0</text>
    <text x="523" y="222">D1</text>
  </g>
  <g text-anchor="middle" fill="#bbbbbb" font-size="12">
    <text x="79"  y="242">r4c2</text>
    <text x="136" y="242">r4c4</text>
    <text x="192" y="242">r1c3</text>
    <text x="248" y="242">GND</text>
    <text x="304" y="242">3.3 V</text>
    <text x="360" y="242">r3c1</text>
    <text x="416" y="242">GND</text>
    <text x="472" y="242">r1c2</text>
    <text x="523" y="242">r4c3</text>
  </g>
  <text x="300" y="300" text-anchor="middle" fill="#cccccc" font-size="13">to the Echo pad (row/column of the pad field)</text>

  <!-- notes -->
  <g font-size="13" fill="#1a1a1a">
    <text x="585" y="100" font-weight="bold">Notes</text>
    <text x="585" y="124">Both GND pins to</text>
    <text x="585" y="141">ground.</text>
    <text x="585" y="168">VDD (pin 4) and the</text>
    <text x="585" y="185">Echo's SD PWR pad</text>
    <text x="585" y="202">share the external</text>
    <text x="585" y="219">3.3 V supply.</text>
    <text x="585" y="246" fill="#d11f1f">Never plug this adapter</text>
    <text x="585" y="263" fill="#d11f1f">into a powered PC card</text>
    <text x="585" y="280" fill="#d11f1f">reader while it is wired</text>
    <text x="585" y="297" fill="#d11f1f">to the Echo.</text>
  </g>
</svg>

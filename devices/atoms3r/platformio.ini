; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = atoms3r

; Platform and libraries at fixed versions (the git library at a commit): a build is the same on
; every PC and in CI, and an update is a deliberate change, tested on the device.
[env]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
; Timestamps, and a copy of everything in logs/ (platformio-device-monitor-*.log).
; DTR/RTS off: opening the monitor must not reset the device.
monitor_filters = time, log2file
monitor_dtr = 0
monitor_rts = 0

board_build.arduino.memory_type = qio_opi
; AtomS3R has 8 MB flash; WiFi + TLS + display do not fit the default 1.25 MB app slot.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; persona.h and prompts.h, shared with the Echo
    -I$PROJECT_DIR/../../shared/prompts
    ; strings over 64 KB in JSON documents (Telegram photos as data URLs, documents)
    -DARDUINOJSON_STRING_LENGTH_SIZE=4

lib_deps =
    m5stack/M5Unified @ 0.2.29
    m5stack/M5GFX @ 0.2.36
    https://github.com/m5stack/M5Echo-Pyramid.git#773d837cb1e30452a6e4e8b02de1ad6b97eeffd2

; Static analysis of our own code (CI: pio check). unusedFunction misses calls across files,
; useStlAlgorithm is a style hint, the #error for a missing secrets.h is no defect, and the
; libraries' headers are not ours.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/>
check_flags =
    cppcheck: --inline-suppr --suppress=unusedFunction --suppress=useStlAlgorithm --suppress=preprocessorErrorDirective --suppress=*:*libdeps*

; GPT Live smart speaker (default).
[env:atoms3r]
build_src_filter = +<*> -<tests/>
; Patches WebSockets (frame limit) and ReadyMail (APPEND to "Sent Items"), see the script.
extra_scripts =
    pre:scripts/patch_libraries.py
    pre:scripts/git_revision.py
; Mozilla's root CAs for MCP servers added at run time (scripts/ca_bundle.py, services/mcp).
board_build.embed_files = data/cert/x509_crt_bundle.bin
; TFLite Micro changes its struct layouts with this define; every user must match the library.
build_flags =
    ${env.build_flags}
    -DTF_LITE_STATIC_MEMORY
lib_deps =
    ${env.lib_deps}
    links2004/WebSockets @ 2.7.3
    bblanchon/ArduinoJson @ 7.4.3
    mobizt/ReadyMail @ 0.4.2
    knolleary/PubSubClient @ 2.8.0

; Hardware test: 5 s record / playback with touch and LEDs.
;   pio run -e record-test -t upload
[env:record-test]
build_src_filter = -<*> +<tests/record_play_test.cpp>

; Echo canceller measurement: plays noise, logs ERLE, delay, CPU time, false barge-ins.
;   pio run -e aec-test -t upload
[env:aec-test]
build_src_filter = -<*> +<tests/aec_test.cpp> +<audio/audio.cpp> +<audio/aec.cpp>
